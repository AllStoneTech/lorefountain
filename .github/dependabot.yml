version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # vsce refuses to package when @types/vscode is newer than
      # engines.vscode; that pin moves only when the supported VS Code
      # floor is raised on purpose.
      - dependency-name: '@types/vscode'
      # @types/node tracks the Node version the editor's extension host runs
      # (22), not the newest release, so major bumps are deliberate.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # A TypeScript major version is a deliberate migration, not a bump.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
