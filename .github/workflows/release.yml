name: Release

# Builds a .vsix and attaches it to a GitHub Release whenever a version tag is
# pushed (see docs/PUBLISHING.md). Does NOT publish to the VS Code Marketplace
# or Open VSX on its own; those need VSCE_PAT/OVSX_PAT repo secrets and are
# commented out below until that's set up.
#
# The paid-tier module lives in a separate private repository (the pro/
# submodule), which this workflow's default token can't read. If a
# PRO_REPO_TOKEN secret (a fine-grained token with read access to that
# repository) is configured, it's checked out and bundled; if not, the build
# is free-tier only and the artifact is named accordingly, so a Pro-less file
# can never be mistaken for the real release build.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # to create the Release and upload the asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PRO_REPO_TOKEN: ${{ secrets.PRO_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the private Pro module
        if: env.PRO_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: AllStoneTech/lorefountain-pro
          token: ${{ secrets.PRO_REPO_TOKEN }}
          path: pro

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit

      - run: npm run package

      - name: Name the artifact
        run: |
          if [ -n "$PRO_REPO_TOKEN" ]; then
            mv lorefountain-*.vsix lorefountain.vsix
            echo "ASSET=lorefountain.vsix" >> "$GITHUB_ENV"
          else
            mv lorefountain-*.vsix lorefountain-free-only.vsix
            echo "ASSET=lorefountain-free-only.vsix" >> "$GITHUB_ENV"
            echo "::warning::PRO_REPO_TOKEN is not set - this build has no Pro module and is named lorefountain-free-only.vsix."
          fi

      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true

      # Once PRO_REPO_TOKEN, VSCE_PAT and OVSX_PAT are all configured (see
      # docs/PUBLISHING.md) and you're ready for automated publishing,
      # uncomment. Never enable these without PRO_REPO_TOKEN: the stores would
      # receive a build without Pro.
      # - run: npx vsce publish --packagePath ${{ env.ASSET }}
      #   env:
      #     VSCE_PAT: ${{ secrets.VSCE_PAT }}
      # - run: npx ovsx publish ${{ env.ASSET }}
      #   env:
      #     OVSX_PAT: ${{ secrets.OVSX_PAT }}
