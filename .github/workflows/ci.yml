name: CI

# Typecheck, lint, and unit-test every push to main and every pull request.
# Runs on the free-tier source only: the private pro/ submodule isn't checked
# out here, and esbuild.js/tsconfig skip it silently when absent.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
